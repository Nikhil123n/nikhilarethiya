<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1220" viewBox="0 0 980 1220" preserveAspectRatio="none" role="img" aria-labelledby="title desc">
  <title id="title">Reference blank sketch project card</title>
  <desc id="desc">A tall cream paper card with a hand drawn border.</desc>
  <defs>
    <filter id="paperNoise" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="15" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.94 0 0 0 0 0.89 0 0 0 0 0.79 0 0 0 .18 0" result="paper"/>
      <feBlend in="SourceGraphic" in2="paper" mode="multiply"/>
    </filter>
    <filter id="roughen" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.045" numOctaves="2" seed="8" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-12%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="6" dy="10" stdDeviation="6" flood-color="#2f2417" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="paperWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.55" stop-color="#f8eedc"/>
      <stop offset="1" stop-color="#f0dfc4"/>
    </linearGradient>
  </defs>
